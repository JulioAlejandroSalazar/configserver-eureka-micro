spring.application.name=semana6
server.port=8080
spring.config.import=optional:configserver:http://localhost:8888
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# kafka
spring.kafka.bootstrap-servers=localhost:29092,localhost:39092
spring.kafka.consumer.group-id=grupo-videojuegos
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# resilience4j circuit breaker
resilience4j.circuitbreaker.instances.videojuegoService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.videojuegoService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.videojuegoService.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.videojuegoService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.videojuegoService.waitDurationInOpenState=5s

# resilience4j retry
resilience4j.retry.instances.videojuegoService.maxAttempts=3
resilience4j.retry.instances.videojuegoService.waitDuration=2s